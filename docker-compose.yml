name: oti-p2-bank-history
services:
  source-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    volumes:
      - source_data:/var/lib/postgresql/data
      - ./source-db/01-accounts.sql:/docker-entrypoint-initdb.d/01-accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d bank"]
      interval: 5s
      timeout: 3s
      retries: 15

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: '1'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 25
      start_period: 20s

  connect:
    image: quay.io/debezium/connect:3.2
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy
    ports:
      - '8083:8083'
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: '1'
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: '1'
      OFFSET_STORAGE_REPLICATION_FACTOR: '1'
      STATUS_STORAGE_REPLICATION_FACTOR: '1'
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
      HEAP_OPTS: '-Xms256m -Xmx512m'

  history-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: history
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_password
    volumes:
      - history_data:/var/lib/postgresql/data
      - ./history-db/01-history.sql:/docker-entrypoint-initdb.d/01-history.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d history"]
      interval: 5s
      timeout: 3s
      retries: 15

  history-worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      history-db:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: bank.public.accounts
      HISTORY_DSN: 'postgresql://demo:demo_password@history-db:5432/history'
      PYTHONUNBUFFERED: '1'

volumes:
  source_data:
  kafka_data:
  history_data:
